<!DOCTYPE html>
<html lang="es">

<style>

  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color:var(--ink); font-size:15px; line-height:1.45;

*{box-sizing:border-box}
body{margin:0;background:var(--bg)}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.2;margin:0 0 .4em} h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}

.muted{color:var(--muted)} .small{font-size:.85rem} .right{text-align:right} .nowrap{white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:.4em;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:.5em .9em;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none!important;line-height:1.2}
.btn:hover{background:var(--line-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-700)}

input,select,textarea{font:inherit;color:inherit;border:1px solid #cfd5de;border-radius:8px;padding:.5em .65em;background:#fff;width:100%}

label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.25em}
.field{margin-bottom:.9em} .field .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1em} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 1em}

.b-recibido{background:var(--info-bg);color:var(--info)} .b-revision{background:var(--warn-bg);color:var(--warn)}
.b-entrevista{background:var(--violet-bg);color:var(--violet)} .b-descartado{background:#eef0f3;color:#5a6372}
.b-contratado{background:var(--ok-bg);color:var(--ok)}
.b-abierta{background:var(--ok-bg);color:var(--ok)} .b-pausada{background:var(--warn-bg);color:var(--warn)} .b-cerrada{background:#eef0f3;color:#5a6372}
table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:.6em .7em;border-bottom:1px solid var(--line-2);vertical-align:middle}

tr.click{cursor:pointer} tr.click:hover td{background:#f8fbfb}

.alert.err{background:var(--bad-bg);color:var(--bad)} .alert.ok{background:var(--ok-bg);color:var(--ok)} .alert.info{background:var(--info-bg);color:var(--info)}

.topbar nav{margin-left:auto;display:flex;gap:.4em;align-items:center;flex-wrap:wrap}
.wrap{max-width:1120px;margin:0 auto;padding:1.5em 1.2em 3em}
.hero{background:linear-gradient(135deg,#0d6b6e 0%,#0a4f62 100%);color:#fff}
.hero .in{max-width:1120px;margin:0 auto;padding:3.2em 1.2em;display:grid;grid-template-columns:1.2fr 1fr;gap:2em;align-items:center}
.hero h1{font-size:2.3rem;margin-bottom:.4em} .hero p{font-size:1.1rem;opacity:.92}
.hero .btn{border-color:#fff} .hero .btn.alt{background:transparent;color:#fff} .hero .btn.alt:hover{background:rgba(255,255,255,.12)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* Charts */

<body>
<div id="root"></div>
<div class="tip" id="tip"></div>
<script>
"use strict";
/* =====================================================================
   TalentoLink – Prototipo funcional (MVP del módulo empresarial)
   Arquitectura: SPA en HTML/CSS/JavaScript sin dependencias.
   Persistencia: IndexedDB del navegador (con respaldo en memoria).
   ===================================================================== */

const VERSION = "1.0.0";
const ESTADOS = [
  {k:"recibido",   t:"Recibido"},
  {k:"revision",   t:"En revisión"},
  {k:"entrevista", t:"Entrevista"},
  {k:"descartado", t:"Descartado"},
  {k:"contratado", t:"Contratado"}
];
const ESTUDIOS = ["Bachiller","Técnico","Tecnólogo","Profesional","Especialización","Maestría"];
const CIUDADES = ["Bogotá","Soacha","Chía","Medellín","Cali","Barranquilla","Bucaramanga","Pereira","Zipaquirá","Mosquera"];
const SECTORES = ["Comercio","Servicios","Manufactura","Tecnología"];
const MODALIDADES = ["Presencial","Híbrido","Remoto"];
const MAX_PDF = 2 * 1024 * 1024; // 2 MB (riesgo R9)
const POLITICA_VERSION = "PTD-2026-01";
const DIA = 86400000;

/* ---------- Utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n==null||n==="" ? "—" : "$ " + Number(n).toLocaleString("es-CO");
const fecha = t => new Date(typeof t==="string" && /^\d{4}-\d{2}-\d{2}$/.test(t) ? t+"T00:00" : t).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"});
const fechaHora = t => new Date(t).toLocaleString("es-CO",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const estadoTxt = k => (ESTADOS.find(e=>e.k===k)||{}).t || k;
const badge = k => `<span class="badge b-${k}">${h(estadoTxt(k))}</span>`;
const vBadge = k => `<span class="badge b-${k}">${({abierta:"Abierta",pausada:"Pausada",cerrada:"Cerrada"})[k]}</span>`;
const radicado = p => "TL-" + new Date(p.creada).getFullYear() + "-" + String(p.id).padStart(6,"0");
const emailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
const rnd = a => a[Math.floor(Math.random()*a.length)];

function confirmar(msg, ok="Confirmar"){
  return new Promise(res=>{
    const m=document.createElement("div"); m.className="modal-bg"; m.id="cdlg";
    m.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" style="width:min(460px,100%);margin-top:15vh"><div class="mb"><p style="font-size:1rem">${h(msg)}</p>
      <div style="display:flex;gap:.5em;justify-content:flex-end"><button class="btn" id="cno">Cancelar</button><button class="btn primary" id="csi">${h(ok)}</button></div></div></div>`;
    document.body.appendChild(m);
    const fin=v=>{m.remove();res(v);};
    $("#cno",m).onclick=()=>fin(false); $("#csi",m).onclick=()=>fin(true); $("#csi",m).focus();
  });
}
const enMarco = (()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
let DL = null; // capacidad de descargas del visor de enlaces (si existe)
(async()=>{ try{ if(window.claude && typeof window.claude.use==="function") DL = await window.claude.use("downloads"); }catch(e){} })();
async function descargar(nombre, blob){
  if(DL){ try{ await DL.save({filename:nombre, data:blob}); toast("Archivo descargado: "+nombre); }catch(e){ if(e && e.code!=="declined") toast("No se pudo descargar el archivo en este visor."); } return true; }
  if(enMarco) return false;
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  return true;
}
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3200);
}

async function hash(txt){
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ // respaldo si SubtleCrypto no está disponible
    let x=5381; for(const c of txt) x=((x<<5)+x+c.charCodeAt(0))|0; return "f"+(x>>>0).toString(16);
  }
}
const salt = () => Math.random().toString(36).slice(2,10);

/* ---------- Persistencia (IndexedDB) ---------- */
const Store = {
  db:null, mem:new Map(), ok:false,
  open(){
    return new Promise(res=>{
      try{
        const r = indexedDB.open("talentolink", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db=r.result; this.ok=true; res(); };
        r.onerror = () => res();
      }catch(e){ res(); }
    });
  },
  get(k){
    if(!this.ok) return Promise.resolve(this.mem.get(k));
    return new Promise(res=>{ const q=this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); });
  },
  set(k,v){
    if(!this.ok){ this.mem.set(k,v); return Promise.resolve(); }
    return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
  },
  del(k){
    if(!this.ok){ this.mem.delete(k); return Promise.resolve(); }
    return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=()=>res(); });
  },
  clear(){
    if(!this.ok){ this.mem.clear(); return Promise.resolve(); }
    return new Promise(res=>{ const tx=this.db.transaction("kv","readwrite"); tx.objectStore("kv").clear(); tx.oncomplete=()=>res(); });
  }
};

let DB = null;
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.set("db", DB), 150); }
const nextId = () => ++DB.seq;

/* ---------- Sesión ---------- */
const SESSION_MIN = 30;
let SESSION = null;
function loadSession(){
  try{ const s = JSON.parse(sessionStorage.getItem("tl_session")||"null"); if(s && Date.now()-s.t < SESSION_MIN*60000) SESSION=s; }catch(e){}
}
function touchSession(){ if(SESSION){ SESSION.t=Date.now(); try{sessionStorage.setItem("tl_session",JSON.stringify(SESSION));}catch(e){} } }
function setSession(u){ SESSION = u ? {uid:u.id, t:Date.now()} : null; try{ u ? sessionStorage.setItem("tl_session",JSON.stringify(SESSION)) : sessionStorage.removeItem("tl_session"); }catch(e){} }
const me = () => SESSION && DB.usuarios.find(u=>u.id===SESSION.uid);
const myCo = () => { const u=me(); return u && DB.empresas.find(e=>e.id===u.empresaId); };
const isAdmin = () => me()?.rol==="admin";
const loginFails = {}; // bloqueo temporal por intentos fallidos

/* ---------- Generador de PDF mínimo (hojas de vida de ejemplo) ---------- */
function makePdf(title, lines){
  const esc = s => String(s).replace(/[\\()]/g, m=>"\\"+m).replace(/[^\x20-\xFF]/g,"?");
  let y = 750, stream = `BT /F2 20 Tf 60 ${y} Td (${esc(title)}) Tj ET\n`;
  y -= 14; stream += `0.05 0.42 0.43 RG 2 w 60 ${y} m 552 ${y} l S\n`; y -= 26;
  for(const ln of lines){
    if(ln.startsWith("#")){ y-=8; stream += `BT /F2 13 Tf 60 ${y} Td (${esc(ln.slice(1))}) Tj ET\n`; y-=20; }
    else { stream += `BT /F1 11 Tf 60 ${y} Td (${esc(ln)}) Tj ET\n`; y-=17; }
  }
  stream += `BT /F1 8 Tf 60 40 Td (Documento de ejemplo generado por el prototipo TalentoLink v${VERSION}.) Tj ET\n`;
  const objs = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
    `<< /Length ${stream.length} >>\nstream\n${stream}endstream`
  ];
  let out = "%PDF-1.4\n", offs=[];
  objs.forEach((o,i)=>{ offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
  out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return new Blob([bytes], {type:"application/pdf"});
}
function cvPdf(p){
  const v = DB.vacantes.find(x=>x.id===p.vacanteId);
  return makePdf("Hoja de vida - " + p.nombre, [
    "#Datos personales",
    "Documento: CC " + p.documento, "Correo: " + p.correo, "Teléfono: " + p.telefono, "Ciudad: " + p.ciudad,
    "#Perfil",
    `Aspirante al cargo de ${v ? v.titulo : "-"} con ${p.experiencia} año(s) de experiencia.`,
    "Nivel de estudios: " + p.estudios, "Aspiración salarial: " + money(p.aspiracion),
    "#Experiencia laboral",
    p.experiencia>0 ? `Experiencia acumulada de ${p.experiencia} año(s) en cargos relacionados.` : "Sin experiencia laboral certificada.",
    "#Formación",
    p.estudios + " - Institución de educación colombiana."
  ]);
}

/* ---------- Correos (simulados) ---------- */
function correo(para, asunto, cuerpo, tipo, empresaId, postId){
  DB.correos.unshift({id:nextId(), para, asunto, cuerpo, tipo, empresaId, postId, fecha:Date.now(), leido:false});
}

const NOMBRES = ["Laura","Andrés","Valentina","Juan Camilo","Daniela","Santiago","María José","Carlos","Natalia","Sebastián","Paula","Felipe","Camila","Diego","Juliana","Alejandro","Manuela","Jorge","Sara","David","Luisa","Mateo","Angélica","Esteban","Carolina","Óscar","Diana","Nicolás","Lorena","Cristian"];
const APELLIDOS = ["Gómez","Rodríguez","Martínez","López","García","Hernández","Ramírez","Torres","Castro","Rojas","Moreno","Vargas","Jiménez","Suárez","Ortiz","Peña","Cárdenas","Mejía","Salazar","Rincón","Galeano","Muñoz","Pardo","Quintero","Beltrán"];
function persona(i){
  const n = rnd(NOMBRES), a1 = rnd(APELLIDOS), a2 = rnd(APELLIDOS);
  const user = (n.split(" ")[0]+"."+a1).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return { nombre:`${n} ${a1} ${a2}`, correo:`${user}${i}@correo.co`, documento:String(1000000000+Math.floor(Math.random()*99999999)), telefono:"3"+String(100000000+Math.floor(Math.random()*899999999)) };
}
function nuevaPost(v, i, overrides={}){
  const per = persona(i);
  const exp = Math.max(0, Math.round(v.experienciaMin + (Math.random()*6-2)));
  const minE = ESTUDIOS.indexOf(v.estudios);
  const est = ESTUDIOS[Math.min(ESTUDIOS.length-1, Math.max(0, minE + Math.floor(Math.random()*3)-1))];
  const asp = Math.round((v.salarioMin + Math.random()*(v.salarioMax - v.salarioMin)*1.3) / 50000) * 50000;
  const creada = overrides.creada || (v.creada + Math.random()*Math.max(DIA, (Math.min(Date.now(), v.cerrada||Date.now()) - v.creada)));
  return Object.assign({
    id: nextId(), vacanteId:v.id, ...per,
    ciudad: Math.random()<.6 ? v.ciudad : rnd(CIUDADES), experiencia:exp, estudios:est, aspiracion:asp,
    mensaje:"", archivoId:null, archivoNombre:"hoja_de_vida.pdf",
    autorizacion:{acepta:true, fecha:creada, version:POLITICA_VERSION, finalidad:"Proceso de selección"},
    estado:"recibido", historial:[{estado:"recibido", fecha:creada, usuario:"Sistema", nota:"Postulación recibida desde la página pública"}],
    entrevista:null, creada
  }, overrides);
}
function mover(p, estado, t, usuario, nota){ p.estado=estado; p.historial.push({estado, fecha:t, usuario, nota:nota||""}); }

async function seed(){
  DB = {seq:100, empresas:[], usuarios:[], vacantes:[], postulaciones:[], correos:[], creado:Date.now(), version:VERSION};
  const now = Date.now();
  const e = {id:nextId(), nombre:"Comercializadora Andina S.A.S.", nit:"901.234.567-8", sector:"Comercio", ciudad:"Bogotá", creada: now-60*DIA};
  DB.empresas.push(e);
  for(const [nombre, correoU, rol] of [["Marcela Ruiz","admin@andina.co","admin"],["Julián Prieto","reclutador@andina.co","reclutador"]]){
    const s = salt(); DB.usuarios.push({id:nextId(), empresaId:e.id, nombre, correo:correoU, rol, salt:s, hash:await hash(s+"Demo2026*"), creado:now-60*DIA});
  }
  const V = (titulo, ciudad, modalidad, smin, smax, exp, est, dias, estado, cierre, desc, req) => {
    const v = {id:nextId(), empresaId:e.id, titulo, ciudad, modalidad, salarioMin:smin, salarioMax:smax, experienciaMin:exp, estudios:est,
      descripcion:desc, requisitos:req, estado, creada:now-dias*DIA, cerrada: cierre ? now-cierre*DIA : null, vacantes:1};
    DB.vacantes.push(v); return v;
  };
  const v1 = V("Auxiliar contable","Bogotá","Presencial",1800000,2400000,1,"Tecnólogo",21,"abierta",null,
    "Apoyar el registro de facturas, conciliaciones bancarias y causación de nómina en el área contable.",
    "Tecnólogo en contabilidad o afines.\nManejo de Excel intermedio y software contable (Siigo o World Office).\nMínimo 1 año de experiencia.");
  const v2 = V("Asesor comercial","Bogotá","Presencial",1423500,2000000,1,"Bachiller",14,"abierta",null,
    "Atender clientes en punto de venta y por canales digitales, cumplir metas de ventas y hacer seguimiento a la cartera.",
    "Bachiller con experiencia en ventas.\nExcelente comunicación y orientación al servicio.\nDisponibilidad para trabajar sábados.");
  const v3 = V("Desarrollador web junior","Bogotá","Remoto",3000000,4200000,1,"Profesional",9,"abierta",null,
    "Mantener la tienda en línea y los tableros internos de la empresa.",
    "Profesional o tecnólogo en sistemas.\nHTML, CSS, JavaScript y bases de datos SQL.\nDeseable conocimiento en Git.");
  const v4 = V("Auxiliar de bodega","Soacha","Presencial",1423500,1700000,0,"Bachiller",48,"cerrada",22,
    "Recibir, almacenar y despachar mercancía; control de inventarios.",
    "Bachiller.\nDisponibilidad de horario.\nDeseable curso de montacargas.");
  const v5 = V("Analista de talento humano","Bogotá","Híbrido",2800000,3500000,2,"Profesional",5,"pausada",null,
    "Liderar procesos de selección, inducción y bienestar.",
    "Profesional en psicología o administración.\nMínimo 2 años en selección de personal.");
  let i=0;
  const plan = [[v1,9],[v2,11],[v3,7],[v4,8],[v5,3]];
  for(const [v,n] of plan){
    for(let k=0;k<n;k++){
      const p = nuevaPost(v, ++i);
      const r = Math.random();
      const t1 = p.creada + DIA*(1+Math.random()*2), t2 = t1 + DIA*(1+Math.random()*3), t3 = t2 + DIA*(2+Math.random()*3);
      const cap = x => Math.min(x, now - 3600000);
      if(v===v4){ // vacante cerrada: proceso completo
        mover(p,"revision",cap(t1),"Marcela Ruiz");
        if(k===0){ mover(p,"entrevista",cap(t2),"Marcela Ruiz"); mover(p,"contratado",cap(t3),"Marcela Ruiz","Seleccionado por experiencia en inventarios."); }
        else if(k<3){ mover(p,"entrevista",cap(t2),"Marcela Ruiz"); mover(p,"descartado",cap(t3),"Marcela Ruiz"); }
        else mover(p,"descartado",cap(t2),"Julián Prieto","No cumple disponibilidad de horario.");
      } else if(r<.35){ /* queda recibido */ }
      else if(r<.6){ mover(p,"revision",cap(t1),"Julián Prieto"); }
      else if(r<.8){ mover(p,"revision",cap(t1),"Julián Prieto"); mover(p,"entrevista",cap(t2),"Marcela Ruiz");
        const d = new Date(now + DIA*(1+Math.floor(Math.random()*6))); p.entrevista={fecha:d.toISOString().slice(0,10), hora:rnd(["09:00","10:30","14:00","15:30"]), lugar:rnd(["Sede Chapinero, Cra 13 # 54-20","Videollamada (Google Meet)"])}; }
      else { mover(p,"revision",cap(t1),"Julián Prieto"); mover(p,"descartado",cap(t2),"Julián Prieto","Perfil no ajustado a los requisitos."); }
      DB.postulaciones.push(p);
    }
  }
  // Bandeja de correos de ejemplo (últimas postulaciones)
  DB.postulaciones.slice().sort((a,b)=>a.creada-b.creada).slice(-6).forEach(notificarPostulacion);
  DB.correos.forEach(c=>c.leido=true);
  await Store.set("db", DB);
}

async function render(){
  closeModal();

  if(PRIVADAS.includes(r)){
    if(SESSION && Date.now()-SESSION.t > SESSION_MIN*60000){ setSession(null); toast("La sesión expiró por inactividad."); }

    touchSession();

    if(soloAdmin && !isAdmin()){ toast("Tu rol (reclutador) no tiene permiso para esta opción."); return go("panel"); }
    const views = {panel:vPanel, vacantes:vVacantes, candidatos:vCandidatos, reportes:vReportes, notificaciones:vNotif, usuarios:vUsuarios, empresa:vEmpresa};
    shell(r, await views[r](parts, q));

}

  Los datos no se venden ni se comparten con terceros ajenos al proceso.`;
}

async function leerArchivo(f){ return new Uint8Array(await f.arrayBuffer()); }

function bindPostulacion(v){
  $("#fp").onsubmit = async ev => {
    ev.preventDefault();
    const val = id => $(id).value.trim();
    const errs = [];
    const d = {nombre:val("#pn"), documento:val("#pd").replace(/\D/g,""), telefono:val("#pt").replace(/\D/g,""), correo:val("#pc").toLowerCase(),
      ciudad:val("#pci"), experiencia:val("#pe"), estudios:val("#pes"), aspiracion:val("#pa"), mensaje:val("#pm")};
    if(d.nombre.split(/\s+/).length<2) errs.push("Escribe tu nombre y al menos un apellido.");
    if(!/^\d{6,10}$/.test(d.documento)) errs.push("El documento debe tener entre 6 y 10 dígitos.");
    if(!/^3\d{9}$/.test(d.telefono)) errs.push("El celular debe tener 10 dígitos y empezar por 3.");
    if(!emailOk(d.correo)) errs.push("El correo electrónico no es válido.");
    if(!d.ciudad) errs.push("Selecciona tu ciudad.");
    if(d.experiencia==="" || +d.experiencia<0 || +d.experiencia>50) errs.push("Indica tus años de experiencia (0 a 50).");
    if(!d.estudios) errs.push("Selecciona tu nivel de estudios.");
    if(!(+d.aspiracion>0)) errs.push("Indica tu aspiración salarial.");
    const f = $("#pf").files[0];
    let bytes = null;
    if(!f) errs.push("Adjunta tu hoja de vida en PDF.");
    else {
      if(f.size > MAX_PDF) errs.push("El archivo supera el tamaño máximo de 2 MB.");
      else { bytes = await leerArchivo(f);
        const head = String.fromCharCode(...bytes.slice(0,5));
        if(head!=="%PDF-" || !/\.pdf$/i.test(f.name)) errs.push("El archivo no es un PDF válido. Solo se aceptan documentos PDF.");
      }
    }
    if(!$("#pok").checked) errs.push("Debes autorizar el tratamiento de datos personales para postularte.");
    if(DB.postulaciones.some(p=>p.vacanteId===v.id && p.documento===d.documento)) errs.push("Ya existe una postulación con este documento para esta vacante.");
    if(errs.length){ $("#perr").innerHTML = `<div class="alert err" role="alert"><b>Revisa el formulario:</b><ul style="margin:.3em 0 0;padding-left:1.2em">${errs.map(e=>`<li>${h(e)}</li>`).join("")}</ul></div>`; $("#perr").scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const now = Date.now(), fileId = "file:"+nextId();
    await Store.set(fileId, new Blob([bytes],{type:"application/pdf"}));
    const p = {id:nextId(), vacanteId:v.id, ...d, experiencia:+d.experiencia, aspiracion:+d.aspiracion,
      archivoId:fileId, archivoNombre:f.name, autorizacion:{acepta:true, fecha:now, version:POLITICA_VERSION, finalidad:"Proceso de selección"},
      estado:"recibido", historial:[{estado:"recibido", fecha:now, usuario:"Sistema", nota:"Postulación recibida desde la página pública"}], entrevista:null, creada:now};
    DB.postulaciones.push(p); notificarPostulacion(p); save();
    $("#postbox").innerHTML = `<div class="alert ok" role="status"><b>¡Postulación enviada!</b></div>
      <p>Gracias, <b>${h(p.nombre)}</b>. Tu número de radicado es:</p>
      <p style="font-size:1.5rem;font-weight:800;color:var(--brand)" id="rad">${radicado(p)}</p>
      <p class="muted">Te enviamos una confirmación a ${h(p.correo)}. Con tu radicado y tu documento puedes consultar el estado de tu proceso en cualquier momento.</p>
      <a class="btn primary" href="#/consulta?r=${radicado(p)}">Consultar mi proceso</a>`;
  };
}

/* ---------- Bandeja de candidatos con filtros ---------- */
let FILTROS = {texto:"", exp:"", est:"", ciudad:"", aspMax:"", estado:"", orden:"recientes"};
function filtrar(list, f){
  const t0 = performance.now();
  const txt = f.texto.toLowerCase(), estMin = f.est ? ESTUDIOS.indexOf(f.est) : -1, amax = f.aspMax ? +f.aspMax : null;
  let r = list.filter(p =>
    (!txt || p.nombre.toLowerCase().includes(txt) || p.correo.includes(txt) || p.documento.includes(txt)) &&
    (f.exp==="" || p.experiencia >= +f.exp) &&
    (estMin<0 || ESTUDIOS.indexOf(p.estudios) >= estMin) &&
    (!f.ciudad || p.ciudad===f.ciudad) &&
    (amax==null || p.aspiracion <= amax) &&
    (!f.estado || p.estado===f.estado));
  const ord = {recientes:(a,b)=>b.creada-a.creada, experiencia:(a,b)=>b.experiencia-a.experiencia, aspiracion:(a,b)=>a.aspiracion-b.aspiracion, nombre:(a,b)=>a.nombre.localeCompare(b.nombre)}[f.orden];
  r.sort(ord);
  return {r, ms: performance.now()-t0};
}

      <div><label for="fe">Experiencia</label><select id="fe"><option value="">Cualquiera</option>${[0,1,2,3,5].map(n=>`<option value="${n}">${n}+ años</option>`).join("")}</select></div>

      <div><label for="fa">Aspiración máx.</label><select id="fa"><option value="">Sin límite</option>${[1500000,2000000,2500000,3000000,4000000,5000000].map(n=>`<option value="${n}">${money(n)}</option>`).join("")}</select></div>

function exportarCSV(list){
  const cols = ["Radicado","Nombre","Documento","Correo","Teléfono","Ciudad","Experiencia","Estudios","Aspiración","Vacante","Estado","Fecha postulación","Autorización datos"];
  const rows = list.map(p=>[radicado(p),p.nombre,p.documento,p.correo,p.telefono,p.ciudad,p.experiencia,p.estudios,p.aspiracion,vacTit(p.vacanteId),estadoTxt(p.estado),new Date(p.creada).toISOString().slice(0,10),p.autorizacion.acepta?"Sí "+p.autorizacion.version:"No"]);
  const csv = "\ufeff" + [cols,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  if(DL || !enMarco){ descargar("candidatos_talentolink.csv", new Blob([csv],{type:"text/csv"})).then(()=>toast(`Se exportaron ${list.length} candidatos.`)); return; }
  { // en visores incrustados las descargas pueden estar bloqueadas: se ofrece copiar
    const m=document.createElement("div"); m.className="modal-bg"; m.id="modal";
    m.innerHTML=`<div class="modal"><div class="mh"><h2 style="margin:0">Exportar ${list.length} candidatos (CSV)</h2><button class="btn ghost x" id="mx">✕</button></div><div class="mb">
      <p class="small muted">Este visor no permite descargar archivos. Copia el contenido y pégalo en Excel o en un archivo .csv.</p>
      <textarea id="csvt" style="min-height:260px;font-family:monospace;font-size:.8rem" readonly>${h(csv.slice(1))}</textarea>
      <div style="display:flex;gap:.5em;margin-top:.6em"><button class="btn primary" id="csvc">Copiar</button></div></div></div>`;
    document.body.appendChild(m); $("#mx").onclick=()=>m.remove();
    $("#csvc").onclick=()=>{ $("#csvt").select(); (navigator.clipboard?navigator.clipboard.writeText(csv.slice(1)):Promise.reject()).then(()=>toast("CSV copiado al portapapeles."),()=>{ try{document.execCommand("copy");toast("CSV copiado.");}catch(e){toast("Selecciona el texto y cópialo con Ctrl+C.");} }); };
  }
}

/* ---------- Reportes ---------- */
function vReportes(){
  const vs = coVacantes(), ps = coPosts();
  const porVac = vs.map(v=>({l:v.titulo, n:ps.filter(p=>p.vacanteId===v.id).length, v})).sort((a,b)=>b.n-a.n);
  const porEst = ESTADOS.map(e=>({l:e.t, n:ps.filter(p=>p.estado===e.k).length}));
  const cerradas = vs.filter(v=>v.cerrada);
  const tCierre = cerradas.length ? cerradas.reduce((s,v)=>s+(v.cerrada-v.creada),0)/cerradas.length/DIA : null;
  const contr = ps.filter(p=>p.estado==="contratado").map(p=>{ const hh=p.historial.find(x=>x.estado==="contratado"); return (hh.fecha-p.creada)/DIA; });
  const tContr = contr.length ? contr.reduce((a,b)=>a+b,0)/contr.length : null;
  const revisadas = ps.filter(p=>p.historial.length>1).map(p=>(p.historial[1].fecha-p.creada)/DIA);
  const tResp = revisadas.length ? revisadas.reduce((a,b)=>a+b,0)/revisadas.length : null;
  const autor = ps.length ? Math.round(100*ps.filter(p=>p.autorizacion?.acepta).length/ps.length) : 100;
  after(()=>{
    const tip = $("#tip");
    $$(".bar").forEach(b=>{ b.onmousemove = e => { tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY-30)+"px"; tip.textContent=b.dataset.t; }; b.onmouseleave=()=>tip.style.display="none"; });
    $("#rcsv").onclick = () => exportarCSV(ps);
  });
  const bars = (data) => { const max = Math.max(1,...data.map(d=>d.n)); return `<div class="bars">${data.map(d=>`<div class="bar-row"><span class="lab" title="${h(d.l)}">${h(d.l)}</span><div class="bar-track"><div class="bar" style="width:${(d.n/max*100).toFixed(1)}%" data-t="${h(d.l)}: ${d.n} postulaciones"></div></div><span class="val">${d.n}</span></div>`).join("")}</div>`; };
  const d1 = n => n==null ? "—" : n.toFixed(1).replace(".",",") + " días";
  return `<div class="head"><div><h1>Reportes</h1><div class="muted">Indicadores del proceso de selección de ${h(myCo().nombre)}</div></div>
    <div class="acts"><button class="btn" id="rcsv">Exportar postulaciones (CSV)</button></div></div>
  <div class="kpis">
    ${kpi(ps.length,"Postulaciones")}
    <div class="card kpi"><div class="v">${d1(tCierre)}</div><div class="l">Tiempo promedio de cierre de vacantes</div></div>
    <div class="card kpi"><div class="v">${d1(tContr)}</div><div class="l">Tiempo promedio hasta contratación</div></div>
    <div class="card kpi"><div class="v">${d1(tResp)}</div><div class="l">Tiempo promedio de primera respuesta</div></div>
    <div class="card kpi"><div class="v">${autor} %</div><div class="l">Postulaciones con autorización de datos</div></div>
  </div>
  <div class="cols">
    <div class="card"><h2>Postulaciones por vacante</h2><p class="muted small">Número de hojas de vida recibidas en cada vacante.</p>${bars(porVac)}</div>
    <div class="card"><h2>Candidatos por estado</h2><p class="muted small">Distribución actual de los candidatos en cada etapa del proceso.</p>${bars(porEst)}</div>
  </div>
  <div class="card" style="margin-top:1.1em;padding:0;overflow:auto"><table><caption style="text-align:left;padding:1em 1.2em .2em"><h2 style="margin:0">Detalle por vacante</h2></caption>
    <thead><tr><th>Vacante</th><th>Estado</th><th class="right">Postulaciones</th><th class="right">Entrevistas</th><th class="right">Contratados</th><th class="right">Días abierta</th></tr></thead><tbody>
    ${porVac.map(({v,n})=>`<tr><td>${h(v.titulo)}</td><td>${vBadge(v.estado)}</td><td class="right">${n}</td>
      <td class="right">${ps.filter(p=>p.vacanteId===v.id && p.historial.some(x=>x.estado==="entrevista")).length}</td>
      <td class="right">${ps.filter(p=>p.vacanteId===v.id && p.estado==="contratado").length}</td>
      <td class="right">${Math.round(((v.cerrada||Date.now())-v.creada)/DIA)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

      save(); toast("Usuario creado."); render();
    };
    $$("[data-del]").forEach(b=>b.onclick=async ()=>{ const u=DB.usuarios.find(x=>x.id===+b.dataset.del); if(await confirmar(`¿Eliminar el acceso de ${u.nombre}?`,"Quitar acceso")){ DB.usuarios=DB.usuarios.filter(x=>x!==u); save(); toast("Acceso eliminado."); render(); } });
  });
  return `<div class="head"><div><h1>Usuarios y roles</h1><div class="muted">Controla quién accede a los datos de los aspirantes.</div></div></div>
  <div class="cols">
    <div class="card" style="padding:0"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th></th></tr></thead><tbody>
      ${us.map(u=>`<tr><td><b>${h(u.nombre)}</b></td><td>${h(u.correo)}</td><td>${u.rol==="admin"?"Administrador":"Reclutador"}</td><td class="right">${u.id!==me().id?`<button class="btn sm danger" data-del="${u.id}">Quitar</button>`:`<span class="small muted">Tú</span>`}</td></tr>`).join("")}
    </tbody></table>
    <div style="padding:1em 1.2em" class="small muted"><b>Administrador:</b> gestiona vacantes, usuarios, datos de la empresa y candidatos.<br><b>Reclutador:</b> revisa candidatos, cambia estados, agenda entrevistas y consulta reportes; no crea ni cierra vacantes.</div></div>
    <div class="card"><h2>Agregar usuario</h2><div id="uerr"></div><form id="fu" novalidate>
      <div class="field"><label for="un">Nombre</label><input id="un"></div>
      <div class="field"><label for="uc">Correo</label><input id="uc" type="email"></div>
      <div class="grid2"><div class="field"><label for="ur">Rol</label><select id="ur"><option value="reclutador">Reclutador</option><option value="admin">Administrador</option></select></div>
      <div class="field"><label for="up">Contraseña temporal</label><input id="up" type="text"></div></div>
      <button class="btn primary">Crear usuario</button></form></div>
  </div>`;
}

/* ---------- Empresa y herramientas del prototipo ---------- */
function vEmpresa(){
  const e = myCo();
  after(()=>{
    $("#fe2").onsubmit = ev => { ev.preventDefault(); e.nombre=$("#en").value.trim()||e.nombre; e.sector=$("#es").value; e.ciudad=$("#eci").value; save(); toast("Datos de la empresa actualizados."); render(); };
    $("#gen").onclick = async () => {
      const abiertas = coVacantes().filter(v=>v.estado!=="cerrada");
      if(!abiertas.length) return toast("Necesitas al menos una vacante abierta o pausada.");
      const t0 = performance.now();
      for(let i=0;i<1000;i++){ const v = abiertas[i%abiertas.length]; DB.postulaciones.push(nuevaPost(v, 5000+i, {creada: Date.now()-Math.random()*20*DIA})); }
      save();
      $("#genres").innerHTML = `<div class="alert ok" style="margin-top:.6em">Se cargaron 1.000 hojas de vida de prueba en ${Math.round(performance.now()-t0)} ms. Total actual: ${coPosts().length.toLocaleString("es-CO")}. Ve a <a href="#/candidatos">Candidatos</a> y aplica filtros para medir el tiempo de respuesta.</div>`;
    };
    $("#rst").onclick = async () => { if(!(await confirmar("Se borrarán todos los datos y se cargarán de nuevo los datos de demostración. ¿Continuar?","Restablecer"))) return; await Store.clear(); await seed(); setSession(null); toast("Datos de demostración restablecidos."); go("login"); };
  });
  return `<div class="head"><div><h1>Empresa y datos</h1><div class="muted">Información de la empresa responsable del tratamiento de datos.</div></div></div>
  <div class="cols">
    <div class="card"><h2>Datos de la empresa</h2><form id="fe2">
      <div class="field"><label for="en">Razón social</label><input id="en" value="${h(e.nombre)}"></div>
      <div class="field"><label>NIT</label><input value="${h(e.nit)}" disabled></div>
      <div class="grid2"><div class="field"><label for="es">Sector</label><select id="es">${SECTORES.map(s=>`<option ${s===e.sector?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label for="eci">Ciudad</label><select id="eci">${CIUDADES.map(s=>`<option ${s===e.ciudad?"selected":""}>${s}</option>`).join("")}</select></div></div>
      <button class="btn primary">Guardar</button></form>
      <h3 style="margin-top:1.4em">Aviso de privacidad que ven los aspirantes</h3><div class="legal" style="max-height:none">${textoPolitica(e)}</div></div>
    <div class="card"><h2>Herramientas del prototipo</h2>
      <p class="small muted">Opciones solo para pruebas y evaluación del prototipo.</p>
      <h3>Prueba de rendimiento (criterio de aceptación 2)</h3>
      <p class="small">Carga 1.000 hojas de vida ficticias para comprobar que los filtros responden en menos de 3 segundos.</p>
      <button class="btn" id="gen">Cargar 1.000 hojas de vida de prueba</button><div id="genres"></div>
      <h3 style="margin-top:1.4em">Restablecer</h3>
      <p class="small">Borra la información guardada en este navegador y vuelve a cargar los datos de demostración.</p>
      <button class="btn danger" id="rst">Restablecer datos de demostración</button>
      <p class="small muted" style="margin-top:1em">Almacenamiento: ${Store.ok?"IndexedDB del navegador (los datos se conservan al recargar)":"memoria temporal (los datos se pierden al recargar)"} · Versión ${VERSION}</p>
    </div>
  </div>`;
}

/* ---------- Arranque ---------- */
(async function init(){
  await Store.open();
  DB = await Store.get("db");
  if(!DB || !DB.empresas) await seed();
  loadSession();
  window.addEventListener("hashchange", render);
  document.addEventListener("click", ()=>touchSession());
  render();
})();
</script>
</body>
</html>
